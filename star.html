<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pure CSS Star Sky</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: black;
        height: 100vh;
        overflow: hidden;
    }

    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    .star {
        position: absolute;
        bottom: -10px;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        animation: rise linear infinite;
        opacity: 0.8;
    }

    @keyframes rise {
        from {
            transform: translateY(0);
            opacity: 0;
        }
        to {
            transform: translateY(-120vh);
            opacity: 1;
        }
    }

    .star:nth-child(1)  { left: 5%;  animation-duration: 6s; }
    .star:nth-child(2)  { left: 15%; animation-duration: 8s; }
    .star:nth-child(3)  { left: 25%; animation-duration: 5s; }
    .star:nth-child(4)  { left: 35%; animation-duration: 7s; }
    .star:nth-child(5)  { left: 45%; animation-duration: 9s; }
    .star:nth-child(6)  { left: 55%; animation-duration: 6s; }
    .star:nth-child(7)  { left: 65%; animation-duration: 8s; }
    .star:nth-child(8)  { left: 75%; animation-duration: 5s; }
    .star:nth-child(9)  { left: 85%; animation-duration: 7s; }
    .star:nth-child(10) { left: 95%; animation-duration: 9s; }
    .star:nth-child(10) { left: 47%; animation-duration: 6s; }
</style>
</head>

<body>

<div class="stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
</div>

</body>
</html>
