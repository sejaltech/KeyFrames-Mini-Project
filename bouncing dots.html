<!DOCTYPE html>
<html>
<head>
<style>
.dot{
    width:15px;
    height:15px;
    background:black;
    border-radius:50%;
    display:inline-block;
    animation: bounce 0.6s infinite alternate;
}

.dot:nth-child(2){ animation-delay:0.2s; }
.dot:nth-child(3){ animation-delay:0.4s; }

@keyframes bounce{
    from{ transform:translateY(0); }
    to{ transform:translateY(-10px); }
}
</style>
</head>
<body>

<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>

</body>
</html>
