<!DOCTYPE html>
<html>
<head>
<style>
.loader{
    width:60px;
    height:60px;
    border:6px solid lightgray;
    border-top:6px solid blue;
    border-radius:50%;
    animation: spin 1s infinite linear;
}

@keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}
</style>
</head>
<body>

<div class="loader"></div>

</body>
</html>
